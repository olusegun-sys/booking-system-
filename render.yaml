services:
  - type: web
    name: booking-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    publishDirectory: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: booking-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ALLOWED_ORIGINS
        value: https://booking-frontend-5e1e.onrender.com,http://localhost:5173
